<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <!-- 
    <form> - ქმნის ერთგვარ კითხვარს გვერდზე, რომელშიც ვათავსებთ
    სხვადასხვა სახის და დაშნინულების შესატან ველებს
    
    <input /> - ცარიელი თეგი, რომლეიც მომხმარებლისგან იღებს
    ინფორმაციას და ატრიბუტის მიხედვით არსებობს სხვადასხვა დანიშნულების
    
    type - ატრიბუტი რომელიც მიუთითებს
    -->

    <form>
        <label for="username" >Username</label>
        <input id="username" type="text" />
        <br>
        <label for="pass">Password</label>
        <input id="pass" type="password" />
        <br>
        <input type="checkbox" />
        <label>Agree to <a>terms & contintions</a></label>
        <br>
        <input type="submit" >
    </form>
</body>
</html>
