<!---->

<html>
    <head>
        <title>Lists in HTML</title>
    </head>
    <body>
        <h1>Lists in HTML</h1>

        <!-- 
        Order List (ol) - დალაგებული ჩამონათვალი
        Unordered List - დაულაგებელი ჩამონათვალი
        List Item - ჩამონთავალის ელემენტი

        <ol></ol> - დალაგებული სიის კონტეინერ თეგი
        <ul><ul> - დაულაგებელი სიის კონტეინერ თგი
        <li></li> - ჩამონათვალის ელემენტი კონტეინერ თეგი
        -->

        <h2>Ordered List</h2>
        <ol>
        </ol>

        <h2>Unordered List</h2>
        <ul>
            <li>Lasha</li>
            <li>Giorgi</li>
        </ul>

        <p>Learn more about programming languages <a href="https://en.wikipedia.org/wiki/Computer_programming">here</a>. Programming is super cool</p>
    </body>
</html>
